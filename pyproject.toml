[project]
name = "bowerbird-bookmarks"
version = "0.7.3"
description = "Audit, clean, categorise and explore your browser bookmarks — link validation, LLM thematic analysis, Wayback recovery, and safe write-back"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Michael Borck", email = "michael.borck@curtin.edu.au" }]
requires-python = ">=3.12"
keywords = ["bookmarks", "browser", "brave", "chrome", "firefox", "link-rot",
            "wayback", "obsidian", "claude", "curation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.90",
]

[project.urls]
Homepage = "https://github.com/michael-borck/bowerbird"

[project.scripts]
bowerbird = "bowerbird.cli:main"
bower = "bowerbird.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["**/._*", "**/.DS_Store"]

[tool.hatch.build.targets.sdist]
only-include = ["bowerbird", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["bowerbird"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["**/._*"]

[tool.ruff.lint]
# The selection the fleet's other Python apps use.
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.basedpyright]
include = ["bowerbird", "tests"]
exclude = ["**/__pycache__", "**/._*"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
# FastAPI registers route handlers by decorator, which this rule cannot see.
reportUnusedFunction = false
reportUnusedVariable = true
reportDuplicateImport = true
