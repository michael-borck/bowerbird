name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --dev
      # ruff and basedpyright run from uv's tool cache rather than .venv: on an exFAT
      # checkout ruff cannot be installed there
      - run: uvx ruff@0.17.6 check .
      - run: uvx basedpyright@1.34.0
      - run: uv run pytest tests/ -q
