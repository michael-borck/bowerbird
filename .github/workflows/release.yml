# Release pipeline (pattern copied from cite-sight): a v* tag triggers
# npm publish, multi-arch Docker images, and (once the shell is chosen,
# ADR-0007) desktop installers.
#
# Secrets expected (add under Settings → Secrets and variables → Actions):
#   NPM_TOKEN            npm automation token for @michaelborck/* publishes
#   DOCKERHUB_USERNAME   optional — Docker Hub mirror of the GHCR image
#   DOCKERHUB_TOKEN      optional — Docker Hub access token
# GHCR pushes use the built-in GITHUB_TOKEN; no secret needed.
#
# macOS signing/notarisation (for the desktop job once enabled, ADR-0007):
#   APPLE_CERTIFICATE           base64 .p12: Developer ID Application + key  [set]
#   APPLE_CERTIFICATE_PASSWORD  password for the .p12                        [set]
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Michael Borck (H7XP9TYKB5)"  [set]
#   APPLE_TEAM_ID               H7XP9TYKB5                                   [set]
#   APPLE_ID                    Apple ID email for notarytool                [set]
#   APPLE_APP_SPECIFIC_PASSWORD app-specific password from account.apple.com [set]
# Electron mapping if that shell is chosen: CSC_LINK=APPLE_CERTIFICATE,
# CSC_KEY_PASSWORD=APPLE_CERTIFICATE_PASSWORD; Tauri uses these names as-is.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test

  npm-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish core
        if: env.NPM_TOKEN != ''
        run: npm publish --access public -w @michaelborck/bowerbird-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish CLI
        if: env.NPM_TOKEN != ''
        run: npm publish --access public -w @michaelborck/bowerbird-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skipped (no NPM_TOKEN configured)
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN not set — skipping npm publish."

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/michael-borck/bowerbird
            ${{ env.DOCKERHUB_USERNAME != '' && 'docker.io/michaelborck/bowerbird' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Electron desktop installers (ADR-0010). Pipeline copied from cite-sight,
  # including its keychain and notarisation workarounds.
  desktop:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Persistent keychain so codesign can still find the Developer ID
      # identity AFTER electron-builder finishes (the keychain it imports
      # CSC_LINK into is torn down once its own signing step completes).
      - name: Set up signing keychain (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          echo "$CSC_LINK_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm /tmp/cert.p12
          security find-identity -v -p codesigning

      - name: Package Electron app
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # NOTARIZE_APPLE_* (not APPLE_*) so electron-builder's broken
          # auto-notarize wrapper doesn't fire alongside our afterSign hook.
          NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZE_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARIZE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        # macOS publishes after we've signed + notarised the DMG container
        # (next step). Other platforms publish straight from electron-builder.
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npx electron-builder --${{ matrix.platform }} --publish=never
          else
            npx electron-builder --${{ matrix.platform }} --publish=always
          fi

      - name: Sign + notarise + staple DMGs (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: packages/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PWD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          IDENTITY=$(security find-identity -v -p codesigning \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "Error: no Developer ID Application identity in keychain"; exit 1
          fi
          echo "Identity: $IDENTITY"
          for dmg in release/*.dmg; do
            echo "=== $dmg ==="
            codesign --sign "$IDENTITY" --timestamp "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PWD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
          done

      - name: Upload macOS artifacts to release
        if: matrix.os == 'macos-latest'
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          # Linux/Windows jobs may run faster and create the draft release first.
          # If it doesn't exist yet, create it (still draft until github-release).
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$TAG" --notes ""
          gh release upload "$TAG" --clobber \
            release/*.dmg \
            release/*.dmg.blockmap \
            release/*-mac.zip \
            release/*-mac.zip.blockmap \
            release/latest-mac.yml

  github-release:
    needs: [docker, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
